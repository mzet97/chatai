# M6: pull secret do Harbor (template — NUNCA commitar com credencial real).
# Fora do caminho de `kubectl apply -f deploy/` de propósito: aplicar este
# arquivo com o placeholder SOBRESCREVERIA o Secret real. Criar fora do repo:
#   kubectl -n chat-local create secret docker-registry harbor-tese-pull \
#     --docker-server=harbor.home.arpa \
#     --docker-username='<usuario-com-pull-em-tese>' \
#     --docker-password='<senha>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# O containerd do k3s não usa o `docker login` do node: sem este Secret o
# pod fica em ImagePullBackOff (visto no M6).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-tese-pull
  namespace: chat-local
  labels:
    app.kubernetes.io/name: claude-chat-local
type: kubernetes.io/dockerconfigjson
data:
  # Placeholder: substitua via comando acima; não commitar `.dockerconfigjson` real.
  .dockerconfigjson: e30=
