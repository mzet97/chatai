[project]
name = "claude-chat-local"
version = "1.0.0"
description = "Chat local (interface + SQLite) com inferência via API da Anthropic"
requires-python = "==3.13.*"
dependencies = [
  "django==5.2.17",
  "anthropic==1.5.0",
  "uvicorn==0.53.0",
  "python-dotenv==1.2.3",
  "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-asyncio==1.4.0",
  "playwright==1.62.0",
  "ruff==0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
markers = ["integration: testes de integração (podem subir uvicorn local)"]
DJANGO_SETTINGS_MODULE = "config.settings"
asyncio_mode = "auto"
testpaths = ["tests"]
