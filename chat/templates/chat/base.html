<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}claude-chat-local{% endblock %}</title>
{% load static %}
<script>
/* Tema antes da primeira pintura: evita flash do tema errado. */
(function () {
  try {
    var t = localStorage.getItem("cc-theme") || "system";
    var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<link rel="stylesheet" href="{% static 'chat/css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'chat/css/app.css' %}">
<link rel="stylesheet" href="{% static 'chat/css/thread.css' %}">
</head>
<body>
{% block body %}{% endblock %}
<script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
{% block scripts %}{% endblock %}
</body>
</html>
